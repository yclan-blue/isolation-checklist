<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>修改後靜態檢核表｜緊急應變計畫</title>
<style>:root{
  --g900:#0f3d2e; --g800:#14532d; --g700:#166534; --g600:#15803d; --g500:#22a05a;
  --g400:#4ade80; --g200:#bbf7d0; --g100:#dcfce7; --g50:#f0fdf4;
  --ink:#1c2b24; --muted:#5b6b63; --line:#dfe9e3; --bg:#ffffff; --soft:#f7faf8;
  --yel:#b45309; --yel-bg:#fef6e4; --red:#b91c1c; --red-bg:#fdecec; --pur:#6d28d9; --pur-bg:#f3edfd;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-size:14.5px;line-height:1.55}
a{color:var(--g700)}
/* top bar */
.topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.topbar .inner{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--g800)}
.brand .dot{width:28px;height:28px;border-radius:8px;background:var(--g600);color:#fff;display:grid;place-items:center;font-size:14px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.flow{display:flex;align-items:center;gap:4px;margin-left:auto;flex-wrap:wrap}
.flow a{text-decoration:none;padding:6px 12px;border-radius:999px;font-size:13px;color:var(--muted);border:1px solid var(--line);background:#fff;white-space:nowrap}
.flow a.on{background:var(--g700);color:#fff;border-color:var(--g700)}
.flow a:hover:not(.on){border-color:var(--g500);color:var(--g700)}
.flow .arr{color:#a3b8ad;font-size:12px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--g500);color:var(--g700)}
.btn.pri{background:var(--g700);border-color:var(--g700);color:#fff}
.btn.pri:hover{background:var(--g800)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
main{max-width:1280px;margin:0 auto;padding:20px}
.page-title{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:4px 0 16px}
.page-title h1{margin:0;font-size:22px;color:var(--g900);letter-spacing:.5px}
.page-title p{margin:4px 0 0;color:var(--muted);font-size:13px}
.saved{font-size:12px;color:var(--muted)}
.saved b{color:var(--g700);font-weight:600}
/* cards & sections */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.card.soft{background:var(--soft)}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.sec-h .tag{font-size:12px;font-weight:700;color:#fff;background:var(--g600);border-radius:6px;padding:2px 8px}
.sec-h h2{margin:0;font-size:16px;color:var(--g900)}
.sec-h .hint{margin-left:auto;font-size:12px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1000px){.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media(max-width:640px){.g2{grid-template-columns:1fr}}
/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],select,textarea{
  font:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;width:100%}
textarea{resize:vertical;min-height:38px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g200);border-color:var(--g500)}
input.auto{background:var(--g50);border-style:dashed;color:var(--g800)}
.unit{position:relative}
.unit span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.unit input{padding-right:30px}
/* segmented result */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:nowrap}
.seg button{font:inherit;font-size:12.5px;border:0;background:#fff;padding:5px 9px;cursor:pointer;color:var(--muted);border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on[data-v=full]{background:var(--g600);color:#fff}
.seg button.on[data-v=part]{background:#f59e0b;color:#fff}
.seg button.on[data-v=none]{background:var(--red);color:#fff}
.seg button.on[data-v=na]{background:#94a3b8;color:#fff}
.seg button.on{background:var(--g600);color:#fff}
/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;position:relative}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:700;color:var(--g900);line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi.warn{border-color:#f5c97a;background:var(--yel-bg)} .kpi.warn .v{color:var(--yel)}
.kpi.bad{border-color:#f2b1b1;background:var(--red-bg)} .kpi.bad .v{color:var(--red)}
.kpi.good .v{color:var(--g700)}
.bar{height:6px;border-radius:99px;background:var(--g100);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--g500);border-radius:99px}
.bar.warn i{background:#f59e0b}.bar.bad i{background:var(--red)}
/* alert banner */
.alert{display:flex;gap:14px;align-items:center;border-radius:12px;padding:14px 16px;border:1px solid}
.alert .lamp{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.alert h3{margin:0;font-size:16px}
.alert p{margin:2px 0 0;font-size:13px}
.lv-green{background:var(--g50);border-color:var(--g200)} .lv-green .lamp{background:var(--g600)} .lv-green h3{color:var(--g800)}
.lv-yellow{background:var(--yel-bg);border-color:#f5d9a6} .lv-yellow .lamp{background:#d97706} .lv-yellow h3{color:var(--yel)}
.lv-red{background:var(--red-bg);border-color:#f2b1b1} .lv-red .lamp{background:var(--red)} .lv-red h3{color:var(--red)}
.lv-purple{background:var(--pur-bg);border-color:#d8c7f7} .lv-purple .lamp{background:var(--pur)} .lv-purple h3{color:var(--pur)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:#fff;white-space:nowrap}
.chip.g{background:var(--g100);border-color:var(--g200);color:var(--g800)}
.chip.y{background:var(--yel-bg);border-color:#f5d9a6;color:var(--yel)}
.chip.r{background:var(--red-bg);border-color:#f2b1b1;color:var(--red)}
.chip.p{background:var(--pur-bg);border-color:#d8c7f7;color:var(--pur)}
.chip.n{background:#f1f5f9;color:#64748b}
/* tables */
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
table.t th{background:var(--g50);color:var(--g900);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12.5px;white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
/* checklist items */
.item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff}
.item .hd{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.item .code{font-weight:700;color:#fff;background:var(--g700);border-radius:6px;padding:1px 8px;font-size:12.5px;flex:none}
.item .ttl{font-weight:600;color:var(--g900)}
.item .q{color:var(--ink);font-size:13.5px;margin-top:2px}
.item .ev{font-size:12.5px;color:var(--muted);margin-top:4px}
.item .ev b{color:var(--g700);font-weight:600}
.item .right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.item .body{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media(max-width:800px){.item .body{grid-template-columns:1fr}.item .right{margin-left:0;align-items:flex-start}}
.item.st-full{border-left:4px solid var(--g500)}
.item.st-part{border-left:4px solid #f59e0b}
.item.st-none{border-left:4px solid var(--red)}
.item.st-na{border-left:4px solid #94a3b8}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-top:8px}
@media(max-width:800px){.checks{grid-template-columns:1fr}}
.checks label{display:flex;gap:7px;align-items:flex-start;font-size:13px;cursor:pointer;padding:2px 0}
.checks input{margin-top:3px;accent-color:var(--g600)}
.cbx{display:flex;flex-wrap:wrap;gap:6px 14px}
.cbx label{display:flex;gap:6px;align-items:center;font-size:13.5px;cursor:pointer}
.cbx input{accent-color:var(--g600)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.side{position:sticky;top:74px}
@media(max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}.side{position:static}}
.ring{width:84px;height:84px;flex:none}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.pipe{display:flex;gap:4px}
.pipe span{flex:1;text-align:center;font-size:11.5px;padding:4px 2px;border-radius:6px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.pipe span.done{background:var(--g100);color:var(--g800);border-color:var(--g200)}
.pipe span.cur{background:var(--g600);color:#fff;border-color:var(--g600)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--g900);color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:10px;background:var(--soft)}
.zone-col h4{margin:0 0 8px;font-size:14px;color:var(--g800);display:flex;align-items:center;gap:8px}
.mini{font-size:12px;color:var(--muted)}
hr.s{border:0;border-top:1px solid var(--line);margin:14px 0}
@media print{
  .topbar,.tools,.btn,.side .noprint{display:none!important}
  main{padding:0;max-width:none}
  .card{break-inside:avoid;border-color:#ccc}
  .layout{grid-template-columns:1fr}
  .side{position:static}
}
.mask{position:fixed;inset:0;background:rgba(15,61,46,.28);display:grid;place-items:center;z-index:200;padding:16px}
.dlg{background:#fff;border-radius:12px;padding:20px;max-width:620px;width:100%;box-shadow:0 20px 50px rgba(15,61,46,.25);border:1px solid var(--line)}
.topg{grid-template-columns:minmax(0,1.1fr) minmax(0,2fr);gap:16px;align-items:stretch}
@media(max-width:900px){.topg{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){main{padding:14px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}.flow{margin-left:0}}
.layout>*,.grid>*{min-width:0}.sec-h{flex-wrap:wrap}
.fig{position:relative;height:340px}.fig>svg{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 18px rgba(15,61,46,.12);opacity:0;transition:opacity .12s;min-width:190px}
@media(max-width:600px){.fig{height:280px}}
.auth-gate{position:fixed;inset:0;z-index:9999;background:rgba(240,253,244,.96);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.auth-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 26px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(15,61,46,.16);text-align:center}
.auth-card .dot{width:44px;height:44px;border-radius:12px;background:var(--g600);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;margin:0 auto 12px}
.auth-card h2{margin:0 0 6px;font-size:19px;color:var(--g900)}
.auth-card p{margin:0 0 16px;font-size:13.5px;color:var(--muted);line-height:1.6}
.auth-btn-wrap{display:flex;justify-content:center;min-height:44px;margin:12px 0}
.auth-msg{font-size:13px;min-height:20px;margin-top:8px;line-height:1.5}
.auth-msg.err{color:var(--red)}
.auth-msg.ok{color:var(--g700)}
.auth-user{display:inline-flex;align-items:center;gap:5px}
.auth-role{font-size:11px;padding:1px 6px;border-radius:999px;background:var(--g100);color:var(--g800);font-weight:600}
.auth-role.ro{background:var(--yel-bg);color:var(--yel)}
body.locked main,body.locked header.topbar{filter:blur(4px);pointer-events:none;user-select:none}
</style>
<script>/* ===== 115年隔離醫院緊急應變檢核：三層共用資料層 ===== */
const STORE_KEY = 'icp115_checklist_v1';
const RES = {full:'完全符合', part:'部分符合', none:'無規劃', na:'不適用'};
const RES_SHORT = {full:'全', part:'部', none:'無', na:'不適用'};
const ZONE_STATUS = ['未啟動','整備中','待驗收','已啟用'];
const NEED_FLOW = ['提出','核准','送達/到班','驗收','可用'];

/* 現場主管 B1–B12（含與院長 T 項、靜態條文之對應） */
const B_ITEMS = [
 {id:'B1',t:'急診接收與交接',q:'病人從急診到第一區，是否有明確檢傷、安置、轉送及交接流程？候床期間誰負責？',ev:'檢傷流程、轉送動線、接收窗口、交接表、候床照護責任',T:['T2'],S:['5-7-1','5-7-4','5-9-5']},
 {id:'B2',t:'三區實際量能',q:'第一、第二、第三區各能收多少人？是否區分規劃床數與已驗收可用床數？',ev:'各區床數、病人類型、已收治人數、當班人力及設備限制',T:['T2'],S:['四','5-3-5','5-7-3']},
 {id:'B3',t:'第二區擴充整備',q:'第一區接近量能限制前，第二區能否及時完成原病人安置、空間清空、整備及驗收？',ev:'整備清單、啟動條件、責任人、工期、開區驗收紀錄',T:['T3','T6'],S:['5-3-4','5-3-5','5-7-3','5-7-4']},
 {id:'B4',t:'第三區預備支援',q:'第二區啟用前，第三區是否已提前安排人員訓練、設備、物資及空間整備？',ev:'準備時程、訓練進度、資源來源、預計驗收及啟用時間',T:['T3','T4'],S:['5-6-2','5-6-3','5-7-3']},
 {id:'B5',t:'各班人力與長期支持',q:'各區醫師、護理、呼吸治療、放射等人力是否足夠？缺勤或長期應變時如何替補、輪休及提供支持？',ev:'分區分班人力表、最低需求、代理名單、休息與員工支持安排',T:['T4'],S:['5-4-1','5-4-2','5-4-4','5-11-3']},
 {id:'B6',t:'跨科及外援能力',q:'跨科或外部支援人員是否完成必要訓練？是否清楚可執行的任務與督導責任？',ev:'資格、PPE訓練、設備操作能力、工作範圍、督導人員',T:['T4'],S:['5-4-3','5-4-4','5-6-2']},
 {id:'B7',t:'設備與供氧能力',q:'呼吸器、HFNC、抽痰設備及氧氣供應是否足以支援預定收治量？設備是否實際可用？',ev:'設備清冊、功能檢測、配件、供氧容量、故障與替代方案',T:['T5'],S:['5-5-1','5-5-2','5-7-4']},
 {id:'B8',t:'物資與藥品供應',q:'PPE、藥品與耗材能維持多久？不足時能否在用盡前完成補給？',ev:'庫存、消耗速度、可用天數、補貨交期、替代供應來源',T:['T5'],S:['5-5-1','5-5-2','5-2-5']},
 {id:'B9',t:'分區感控與聯合驗收',q:'各區隔離、通風、清消、電梯、樓梯、保全及廢棄物動線是否符合要求？開區前是否完成聯合驗收？',ev:'感控、護理、醫工、工務、保全及清潔等單位確認紀錄',T:['T3','T8'],S:['5-2-4','5-9-5','5-9-6','5-9-8','5-10-3']},
 {id:'B10',t:'醫療服務與後勤銜接',q:'檢驗、放射、藥事、重症、營養及後勤服務是否能支援各區？一般病房服務如何維持？',ev:'支援流程、窗口、服務時段、原病人安置及必要醫療保障',T:['T6'],S:['5-7-2','5-7-4','5-7-5']},
 {id:'B11',t:'量能不足與轉院',q:'院內三區仍不足，或病人需要本院無法提供的照護時，如何啟動轉院？',ev:'轉院條件、醫療網聯繫、接收確認、運送、交接及等待期間照護',T:['T7'],S:['5-7-2','5-7-3','5-7-4','5-8-2']},
 {id:'B12',t:'資源到位與異常回報',q:'主管提出的人力、設備、物資需求，是否追蹤到真正可用？通訊中斷或資源延誤時如何升級處理？',ev:'需求→核准→送達／到班→驗收→可用紀錄；通訊備援及異常升級程序',T:['T8','T1'],S:['5-8-1','5-8-3','5-1','5-12']},
];

/* 院長 T1–T8 */
const T_ITEMS = [

/* ===== KPI engine ===== */
const n = v => (v===''||v==null||isNaN(+v))?null:+v;
function computeKPI(f){
  const zones = f.zones.map(z=>{
    const acc=n(z.accepted), adm=n(z.admitted), st=n(z.staff), mn=n(z.minStaff);
    return Object.assign({},z,{acc,adm,rem:(acc!=null&&adm!=null)?Math.max(acc-adm,0):null,
      occ:(acc&&adm!=null)?adm/acc:null, staffRatio:(st!=null&&mn)?st/mn:null});
  });
  let act = zones.filter(z=>z.status==='已啟用');
  const accAll = act.reduce((s,z)=>s+(z.acc||0),0);
  const admAll = zones.reduce((s,z)=>s+(z.adm||0),0);
  const admAct = act.reduce((s,z)=>s+(z.adm||0),0);
  const remAll = act.reduce((s,z)=>s+(z.rem||0),0);
  const plannedAll = zones.reduce((s,z)=>s+(n(z.planned)||0),0);
  const accTotal = zones.reduce((s,z)=>s+(z.acc||0),0);
  const occAll = accAll? admAct/accAll : null;
  const o=f.ops;
  const ventOcc = n(o.ventTotal)? (n(o.ventUsed)||0)/n(o.ventTotal):null;
  const icuOcc  = n(o.icuTotal)? (n(o.icuUsed)||0)/n(o.icuTotal):null;
  const edWait = n(o.edWait);
  // 警示分級
  const reasons=[]; let level='green';
  if(occAll!=null&&occAll>=.8){level='yellow';reasons.push('專責病床佔床率 '+pct(occAll)+' ≥ 80%')}
  if(edWait!=null&&edWait>=6){level='yellow';reasons.push('急診等床 '+edWait+' 小時 ≥ 6 小時')}
  if(ventOcc!=null&&ventOcc>=.85){level='red';reasons.push('呼吸器佔用率 '+pct(ventOcc)+' ≥ 85%')}
  if(icuOcc!=null&&icuOcc>=.85){level='red';reasons.push('ICU 佔用率 '+pct(icuOcc)+' ≥ 85%')}
  if(o.exhausted){level='purple';reasons.push('設備用罄且無可用調借或外部支援管道')}
  if(!reasons.length) reasons.push('佔床率 < 80% 且急診等床 < 6 小時');
  // 病人湧入分級（CHIME 示意）
  const surge = admAll>=45?4:admAll>=15?3:admAll>=6?2:1;
  // 時間推估
  const daily=n(o.dailyNew);
  const daysToFull = (daily&&daily>0)? remAll/daily : null;
  const prep=n(o.prepDays), buf=n(o.bufferDays);
  const latestDays = (daysToFull!=null&&prep!=null)? daysToFull-prep-(buf||0) : null;
  const base = f.meta.dataTime? new Date(f.meta.dataTime) : new Date();
  const addD = d => d==null?null:new Date(base.getTime()+d*864e5);
  // 最先不足資源
  const cand=[];
  if(daysToFull!=null) cand.push({res:'可收治床位（已啟用區）',days:daysToFull});
  if(n(o.ppeDays)!=null) cand.push({res:'PPE／耗材',days:n(o.ppeDays),lead:n(o.ppeLead)});
  const shortStaff = zones.filter(z=>z.status==='已啟用'&&z.staffRatio!=null&&z.staffRatio<1);
  if(shortStaff.length) cand.push({res:'當班合格人力（'+shortStaff.map(z=>z.name).join('、')+'）',days:0});
  if(ventOcc!=null&&ventOcc>=.85) cand.push({res:'呼吸器',days:0});
  if(icuOcc!=null&&icuOcc>=.85) cand.push({res:'ICU 床位',days:0});
  if(n(o.o2Load)!=null&&n(o.o2Load)>=90) cand.push({res:'供氧系統負載',days:0});
  cand.sort((a,b)=>a.days-b.days);
  const first = cand[0]||null;
  const ppeMargin = (n(o.ppeDays)!=null&&n(o.ppeLead)!=null)? n(o.ppeDays)-n(o.ppeLead):null;
  return {zones,accAll,admAll,admAct,remAll,plannedAll,accTotal,occAll,ventOcc,icuOcc,edWait,level,reasons,surge,
    daysToFull,latestDays,gapAt:addD(daysToFull),latestAt:addD(latestDays),first,cand,ppeMargin,
    o2:n(o.o2Load),staffShort:shortStaff, comp:compliance(f.items,B_ITEMS), needs:needStats(f.needs)};
}
function compliance(items,list){
  const c={full:0,part:0,none:0,na:0,unset:0};
  list.forEach(it=>{const r=(items[it.id]||{}).r; c[r||'unset']++});
  const denom=c.full+c.part+c.none;
  c.score = denom? (c.full+c.part*.5)/denom : null;
  c.done = list.length-c.unset; c.total=list.length;
  return c;
}
function needStats(needs){
  const s={total:needs.length,by:{},overdue:[],open:0};
  NEED_FLOW.forEach(k=>s.by[k]=0);
  const today=new Date(); today.setHours(0,0,0,0);
  needs.forEach(x=>{s.by[x.status||'提出']=(s.by[x.status||'提出']||0)+1;
    if(x.status!=='可用'){s.open++; if(x.due&&new Date(x.due)<today) s.overdue.push(x)}});
  return s;
}

const $=(s,r=document)=>r.querySelector(s); const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=v=>v==null?'—':Math.round(v*100)+'%';
const fx=(v,d=1)=>v==null?'—':(Math.round(v*Math.pow(10,d))/Math.pow(10,d)).toString();
function fmtDT(d){if(!d)return '—';d=new Date(d);if(isNaN(d))return '—';const p=x=>String(x).padStart(2,'0');return `${d.getMonth()+1}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}
function fmtDays(d){if(d==null)return '—';if(d<0)return '已逾 '+fx(-d)+' 天';if(d<1)return fx(d*24,0)+' 小時';return fx(d)+' 天'}
function toast(msg){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function seg(name,val,opts=['full','part','none','na'],labels=RES_SHORT){
  return `<div class="seg" data-seg="${name}">${opts.map(o=>`<button type="button" data-v="${o}" class="${val===o?'on':''}">${labels[o]}</button>`).join('')}</div>`;
}
function bindSeg(root,cb){root.addEventListener('click',e=>{const b=e.target.closest('.seg button');if(!b)return;const s=b.parentElement;const was=b.classList.contains('on');$$('button',s).forEach(x=>x.classList.remove('on'));const v=was?'':b.dataset.v;if(v)b.classList.add('on');cb(s.dataset.seg,v,b.dataset.v)})}
function resChip(r){return r?`<span class="chip ${({full:'g',part:'y',none:'r',na:'n'})[r]}">${RES[r]}</span>`:'<span class="chip">未填</span>'}
function worst(rs){const order=['none','part','full'];const v=rs.filter(r=>r&&r!=='na');if(!v.length)return '';return order.find(o=>v.includes(o))}
function ring(score,size=84){
  const r=34,c=2*Math.PI*r,v=score==null?0:score;
  const col=score==null?'#cbd5e1':v>=.8?'#15803d':v>=.5?'#d97706':'#b91c1c';
  return `<svg class="ring" viewBox="0 0 84 84" width="${size}" height="${size}"><circle cx="42" cy="42" r="${r}" fill="none" stroke="#e6efe9" stroke-width="9"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*v} ${c}" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" font-size="17" font-weight="700" fill="${col}">${score==null?'—':Math.round(v*100)+'%'}</text></svg>`;
}

function modal(html){const w=document.createElement('div');w.className='mask';w.innerHTML=`<div class="dlg">${html}</div>`;document.body.appendChild(w);return w}
function ask(msg,ok='確定'){return new Promise(res=>{const w=modal(`<p style="margin:0 0 16px">${esc(msg)}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-x>取消</button><button class="btn pri" data-ok>${esc(ok)}</button></div>`);
  w.onclick=e=>{if(e.target.matches('[data-ok]')){w.remove();res(true)}else if(e.target===w||e.target.matches('[data-x]')){w.remove();res(false)}}})}
function dataDialog(){
  const json=JSON.stringify(Store.load(),null,2);
  const w=modal(`<h3 style="margin:0 0 6px;color:var(--g900)">匯出／匯入資料</h3><p class="mini" style="margin:0 0 10px">跨電腦傳遞：複製下方 JSON 或下載檔案；在另一台電腦貼上或選擇檔案後按「匯入」。</p>
   <textarea id="jx" rows="12" style="font-family:ui-monospace,monospace;font-size:12px">${esc(json)}</textarea>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn" data-cp>複製</button><button class="btn" data-dl>下載 .json</button><label class="btn" style="cursor:pointer">選擇檔案<input type="file" accept=".json,application/json" hidden data-fl></label>
   <span style="flex:1"></span><button class="btn" data-x>關閉</button><button class="btn pri" data-im>匯入上方內容</button></div>`);
  const ta=$('#jx',w);
  w.onclick=async e=>{const t=e.target;
    if(t===w||t.matches('[data-x]'))w.remove();
    else if(t.matches('[data-cp]')){try{await navigator.clipboard.writeText(ta.value);toast('已複製')}catch(_){ta.select();toast('請按 Ctrl/⌘+C 複製')}}
    else if(t.matches('[data-dl]')){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ta.value],{type:'application/json'}));a.download='檢核表資料_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()}catch(_){};toast('若未開始下載，請改用「複製」')}
    else if(t.matches('[data-im]')){try{const d=JSON.parse(ta.value);if(!d.field)throw 0;Store.write(d,ALL_PARTS);await Cloud.push(true);location.reload()}catch(_){toast('JSON 格式不符，請確認內容')}}};
  $('[data-fl]',w).onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{ta.value=r.result;toast('已載入檔案，按「匯入上方內容」套用')};r.readAsText(f)};
}

const GAS_CODE = "/**\n * 115年隔離醫院緊急應變檢核表 — Google 試算表後端（含 Google 登入白名單驗證）\n * 使用方式：\n * 1. 將下方 GOOGLE_CLIENT_ID 填入 Google Cloud OAuth 2.0 網頁用戶端 ID。\n * 2. 在試算表中「擴充功能 → Apps Script」，貼上本程式碼並儲存。\n * 3. 執行一次 setup()（會建立「授權名單」工作表並自動加入試算表擁有者 Email）。\n * 4. 在「授權名單」工作表新增允許存取的 Google 帳號（Email、權限：編輯／唯讀、狀態：啟用）。\n * 5. 「部署 → 管理部署作業 → 編輯 → 版本：新版本 → 部署」（執行身分：我；誰可以存取：所有人）。\n */\nconst GOOGLE_CLIENT_ID = '617987658234-tb5q7dqalnbmdji0cu4okdf21isjl53m.apps.googleusercontent.com';\n\nconst SHEETS = {\n  store: '資料儲存',\n  log: '異動紀錄',\n  kpi: 'KPI紀錄',\n  needs: '需求追蹤',\n  items: '查核結果',\n  auth: '授權名單',\n};\nconst PARTS = ['field', 'director', 'static'];\nconst PART_NAME = { field: '現場主管版', director: '院長版', static: '靜態檢核表' };\nconst RES = { full: '完全符合', part: '部分符合', none: '無規劃', na: '不適用' };\n\nfunction setup() {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  const mk = (name, header) => {\n    let sh = ss.getSheetByName(name);\n    if (!sh) sh = ss.insertSheet(name);\n    if (header && sh.getLastRow() === 0) {\n      sh.appendRow(header);\n      sh.getRange(1, 1, 1, header.length).setFontWeight('bold').setBackground('#dcfce7');\n      sh.setFrozenRows(1);\n    }\n    return sh;\n  };\n  const st = mk(SHEETS.store, ['部分', 'JSON 資料（請勿手動修改）', '更新時間']);\n  PARTS.forEach((p, i) => { if (!st.getRange(i + 2, 1).getValue()) st.getRange(i + 2, 1).setValue(p); });\n  mk(SHEETS.log, ['時間', '頁面', '醫院', '填報／簽核人', '摘要']);\n  mk(SHEETS.kpi, ['時間', '醫院', '警示燈號', '湧入分級', '已驗收可用床', '已收治', '可再收', '佔床率', '急診等床(時)', '呼吸器佔用', 'ICU佔用', '預估滿床(天)', '最晚決策(天)', '最先不足資源', 'B1–B12符合度']);\n  mk(SHEETS.needs, ['需求編號', '區域', '類型', '需求內容', '數量', '提出日', '需到位期限', '進度', '院長核定措施', '經費', '執行人', '完成期限', '到位與驗收結果']);\n  mk(SHEETS.items, ['項目', '主題', '結果', '佐證', '缺口／說明', '更新時間']);\n  const au = mk(SHEETS.auth, ['Google Email（小寫）', '姓名／職稱', '權限（編輯／唯讀）', '狀態（啟用／停用）', '備註']);\n  if (au.getLastRow() === 1) {\n    const owner = (Session.getEffectiveUser().getEmail() || '').trim().toLowerCase();\n    if (owner) au.appendRow([owner, '管理員（試算表擁有者）', '編輯', '啟用', 'setup() 自動加入']);\n  }\n  const def = ss.getSheetByName('工作表1') || ss.getSheetByName('Sheet1');\n  if (def && ss.getSheets().length > 1 && def.getLastRow() === 0) ss.deleteSheet(def);\n}\n\nfunction authErr_(code, msg) {\n  const e = new Error(msg);\n  e.code = code;\n  return e;\n}\n\nfunction verifyUser_(token) {\n  if (!GOOGLE_CLIENT_ID) throw authErr_('CONFIG_ERROR', '後端尚未設定 GOOGLE_CLIENT_ID');\n  if (!token) throw authErr_('UNAUTHORIZED', '請先使用 Google 帳號登入');\n\n  const digest = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, String(token));\n  const cacheKey = 'gtok_' + Utilities.base64EncodeWebSafe(digest);\n  const cache = CacheService.getScriptCache();\n  let info = null;\n  const cached = cache.get(cacheKey);\n  if (cached) {\n    try { info = JSON.parse(cached); } catch (e) {}\n  }\n  if (!info) {\n    const resp = UrlFetchApp.fetch('https://oauth2.googleapis.com/tokeninfo?id_token=' + encodeURIComponent(String(token)), { muteHttpExceptions: true });\n    if (resp.getResponseCode() !== 200) throw authErr_('TOKEN_EXPIRED', 'Google 登入憑證無效或已過期，請重新登入');\n    const j = JSON.parse(resp.getContentText());\n    if (j.aud !== GOOGLE_CLIENT_ID) throw authErr_('UNAUTHORIZED', 'Google 登入來源（Client ID）不符');\n    if (j.email_verified !== 'true' && j.email_verified !== true) throw authErr_('UNAUTHORIZED', 'Google 帳號 Email 尚未驗證');\n    const expMs = Number(j.exp || 0) * 1000;\n    if (!expMs || expMs <= Date.now()) throw authErr_('TOKEN_EXPIRED', 'Google 登入已過期，請重新登入');\n    info = { email: String(j.email || '').trim().toLowerCase(), name: String(j.name || ''), expMs: expMs };\n    const ttl = Math.min(300, Math.max(10, Math.floor((expMs - Date.now()) / 1000) - 5));\n    cache.put(cacheKey, JSON.stringify(info), ttl);\n  } else if (info.expMs <= Date.now()) {\n    cache.remove(cacheKey);\n    throw authErr_('TOKEN_EXPIRED', 'Google 登入已過期，請重新登入');\n  }\n\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  const sh = ss.getSheetByName(SHEETS.auth);\n  if (!sh) throw authErr_('CONFIG_ERROR', '尚未建立「授權名單」工作表，請執行 setup()');\n  const lastRow = sh.getLastRow();\n  if (lastRow < 2) throw authErr_('FORBIDDEN', '「授權名單」尚無任何帳號，請聯繫管理員加入：' + info.email);\n  const rows = sh.getRange(2, 1, lastRow - 1, 4).getValues();\n  for (let i = 0; i < rows.length; i++) {\n    const em = String(rows[i][0] || '').trim().toLowerCase();\n    const status = String(rows[i][3] || '').trim();\n    if (em && em === info.email) {\n      if (status === '停用') throw authErr_('FORBIDDEN', '此 Google 帳號（' + info.email + '）已被停用，請聯繫管理員');\n      const role = String(rows[i][2] || '').trim() === '唯讀' ? 'viewer' : 'editor';\n      return { email: info.email, name: String(rows[i][1] || info.name || info.email).trim(), role: role };\n    }\n  }\n  throw authErr_('FORBIDDEN', '此 Google 帳號（' + info.email + '）尚未獲得授權，請聯繫管理員加入試算表「授權名單」');\n}\n\nfunction readAll_() {\n  const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(SHEETS.store);\n  if (!sh) throw new Error('尚未執行 setup()');\n  const out = {};\n  PARTS.forEach((p, i) => {\n    const v = sh.getRange(i + 2, 2).getValue();\n    if (v) { try { out[p] = JSON.parse(v); } catch (e) {} }\n  });\n  return out;\n}\n\nfunction json_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n\nfunction doGet(e) {\n  try {\n    const token = e && e.parameter && e.parameter.token;\n    const user = verifyUser_(token);\n    return json_({ ok: true, user: user, data: readAll_(), serverTime: Date.now() });\n  } catch (err) {\n    return json_({ ok: false, code: err.code || 'ERROR', error: String(err.message || err) });\n  }\n}\n\nfunction doPost(e) {\n  let body, user;\n  try {\n    body = JSON.parse(e.postData.contents);\n    user = verifyUser_(body.token);\n    if (body.action === 'get') {\n      return json_({ ok: true, user: user, data: readAll_(), serverTime: Date.now() });\n    }\n    if (user.role !== 'editor') {\n      throw authErr_('FORBIDDEN', '此帳號（' + user.email + '）僅有「唯讀」權限，無法修改雲端資料');\n    }\n  } catch (err) {\n    return json_({ ok: false, code: err.code || 'ERROR', error: String(err.message || err) });\n  }\n\n  const lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    const ss = SpreadsheetApp.getActiveSpreadsheet();\n    const st = ss.getSheetByName(SHEETS.store);\n    if (!st) throw new Error('尚未執行 setup()');\n    const now = new Date();\n    const saved = [];\n    PARTS.forEach((p, i) => {\n      const part = body.parts && body.parts[p];\n      if (!part) return;\n      const cur = st.getRange(i + 2, 2).getValue();\n      let curTs = 0; try { curTs = cur ? (JSON.parse(cur)._ts || 0) : 0; } catch (x) {}\n      if ((part._ts || 0) < curTs) return; // 雲端較新，不覆蓋\n      const s = JSON.stringify(part);\n      if (s.length > 49000) throw new Error(p + ' 資料過大（超過試算表儲存格上限）');\n      st.getRange(i + 2, 1, 1, 3).setValues([[p, s, now]]);\n      saved.push(p);\n    });\n    const all = readAll_();\n    const f = all.field || {}, meta = f.meta || {};\n    const actor = body.by ? (body.by + ' [' + user.email + ']') : user.email;\n    if (saved.length) {\n      ss.getSheetByName(SHEETS.log).appendRow([now, saved.map(p => PART_NAME[p]).join('、'), meta.hospital || '', actor, body.summary || '']);\n    }\n    if (body.kpi && saved.indexOf('field') > -1) {\n      const k = body.kpi;\n      ss.getSheetByName(SHEETS.kpi).appendRow([now, meta.hospital || ''].concat(['level', 'surge', 'accAll', 'admAll', 'remAll', 'occAll', 'edWait', 'ventOcc', 'icuOcc', 'daysToFull', 'latestDays', 'first', 'comp'].map(x => k[x] == null ? '' : k[x])));\n    }\n    if (saved.indexOf('field') > -1 || saved.indexOf('director') > -1) writeNeeds_(ss, all);\n    if (saved.indexOf('field') > -1) writeItems_(ss, f, now);\n    return json_({ ok: true, user: user, saved: saved, data: all, serverTime: Date.now() });\n  } catch (err) {\n    return json_({ ok: false, code: err.code || 'ERROR', error: String(err.message || err) });\n  } finally {\n    lock.releaseLock();\n  }\n}\n\nfunction writeNeeds_(ss, all) {\n  const sh = ss.getSheetByName(SHEETS.needs);\n  const needs = (all.field && all.field.needs) || [];\n  const dec = (all.director && all.director.decisions) || {};\n  if (sh.getLastRow() > 1) sh.getRange(2, 1, sh.getLastRow() - 1, 13).clearContent();\n  if (!needs.length) return;\n  const rows = needs.map(x => { const d = dec[x.id] || {}; return [x.id || '', x.zone || '', x.type || '', x.desc || '', x.qty || '', x.raised || '', x.due || '', x.status || '提出', d.measure || '', d.budget || '', d.owner || '', d.due || '', d.result || '']; });\n  sh.getRange(2, 1, rows.length, 13).setValues(rows);\n}\n\nfunction writeItems_(ss, f, now) {\n  const sh = ss.getSheetByName(SHEETS.items);\n  const items = f.items || {};\n  const titles = { B1: '急診接收與交接', B2: '三區實際量能', B3: '第二區擴充整備', B4: '第三區預備支援', B5: '各班人力與長期支持', B6: '跨科及外援能力', B7: '設備與供氧能力', B8: '物資與藥品供應', B9: '分區感控與聯合驗收', B10: '醫療服務與後勤銜接', B11: '量能不足與轉院', B12: '資源到位與異常回報' };\n  const rows = Object.keys(titles).map(id => { const v = items[id] || {}; return [id, titles[id], RES[v.r] || '', v.ev || '', v.gap || '', now]; });\n  if (sh.getLastRow() > 1) sh.getRange(2, 1, sh.getLastRow() - 1, 6).clearContent();\n  sh.getRange(2, 1, rows.length, 6).setValues(rows);\n}\n";

  async boot(){

      const j=await Cloud.req('GET');
      Auth.user=j.user||null; Auth.verified=true; Auth.updateChip(); Auth.hideGate();
      Cloud.last=new Date(); Cloud.status(Cloud.dirty().length&&!Auth.isViewer()?'pending':'ok','');
      if(j.data)Cloud.apply(j.data);
      Cloud.startPoll();
    }catch(err){
      const code=err.code||'';
      if(code==='FORBIDDEN'||code==='UNAUTHORIZED'||code==='TOKEN_EXPIRED'){
        Auth.setToken(''); Auth.user=null; Auth.verified=false; Auth.updateChip();
        Auth.clearLocal();
        Auth.showGate(err.message||'登入已失效，請重新登入',true);

const Cloud = {
  KEY:'icp115_gas_url', DKEY:'icp115_dirty', timer:null, poll:null, busy:false, state:'off', last:null, err:'', _bound:false,
  url(){try{return localStorage.getItem(Cloud.KEY)||GAS_DEFAULT_URL}catch(e){return GAS_DEFAULT_URL}},
  setUrl(u){try{u?localStorage.setItem(Cloud.KEY,u):localStorage.removeItem(Cloud.KEY)}catch(e){}},
  dirty(){try{return JSON.parse(localStorage.getItem(Cloud.DKEY)||'[]')}catch(e){return []}},
  setDirty(a){try{localStorage.setItem(Cloud.DKEY,JSON.stringify([...new Set(a)]))}catch(e){}},
  markDirty(parts){if(!parts||!parts.length)return;if(Auth.isViewer()){toast('此帳號為唯讀權限，變更不會上傳雲端');return}Cloud.setDirty(Cloud.dirty().concat(parts));Cloud.schedule()},
  schedule(){if(!Cloud.url()||!Auth.verified||Auth.isViewer())return;clearTimeout(Cloud.timer);Cloud.status('pending');Cloud.timer=setTimeout(()=>Cloud.push(),1500)},
  status(st,msg){Cloud.state=st;if(msg!=null)Cloud.err=msg;const el=document.getElementById('cloudSt');if(!el)return;
    const map={off:'☁ 雲端：未設定',pending:'☁ 待上傳…',sync:'☁ 同步中…',ok:'☁ 已同步 '+(Cloud.last?fmtDT(Cloud.last).split(' ')[1]:''),err:'☁ 同步失敗'};
    el.textContent=map[st]||st; el.parentElement.style.color=st==='err'?'var(--red)':st==='ok'?'var(--g700)':''; el.parentElement.title=st==='err'?Cloud.err:'雲端同步設定'},
  summary(db){
    const k=computeKPI(db.field);
    return {kpi:{level:LEVEL[k.level].name,surge:SURGE[k.surge].name,accAll:k.accAll,admAll:k.admAll,remAll:k.remAll,occAll:pct(k.occAll),edWait:k.edWait,ventOcc:pct(k.ventOcc),icuOcc:pct(k.icuOcc),
        daysToFull:k.daysToFull==null?'':+fx(k.daysToFull),latestDays:k.latestDays==null?'':+fx(k.latestDays),first:k.first?k.first.res:'',comp:pct(k.comp.score)},k};
  },
  async req(method,body){
    const u=Cloud.url(); if(!u) throw new Error('未設定網址');
    const token=Auth.token||Auth.savedToken();
    if(!token){const e=new Error('請先使用 Google 帳號登入');e.code='UNAUTHORIZED';throw e}
    const payload=method==='GET'?{action:'get',token}:Object.assign({action:'post',token},body||{});
    const r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    const j=await r.json();
    if(!j.ok){
      const e=new Error(j.error||'伺服器錯誤'); e.code=j.code||'ERROR';
      if(Auth.verified&&(e.code==='TOKEN_EXPIRED'||e.code==='UNAUTHORIZED'||e.code==='FORBIDDEN')){
        Auth.setToken(''); Auth.user=null; Auth.verified=false; Auth.updateChip(); clearInterval(Cloud.poll);
        if(e.code==='FORBIDDEN')Auth.clearLocal();
        Auth.showGate(e.message,true);
      }
      throw e;
    }
    return j;
  },
  async push(force){
    if(!Cloud.url()||!Auth.verified) return;
    if(Auth.isViewer()){Cloud.setDirty([]);Cloud.status('ok','');toast('此帳號為唯讀權限，變更不會上傳雲端');return}
    const d=Cloud.dirty(); if(!d.length&&!force) return;
    if(Cloud.busy){Cloud.schedule();return} Cloud.busy=true; Cloud.status('sync');
    try{
      const db=Store.load(), parts={}; d.forEach(p=>{if(db[p])parts[p]=db[p]});
      const {kpi,k}=Cloud.summary(db);
      const by=PAGE_PART==='field'?(db.field.meta.reporter||''):PAGE_PART==='director'?((db.director.meta||{}).commander||''):'';
      const summary=d.includes('field')?`${LEVEL[k.level].name}｜可再收 ${k.remAll}｜B符合度 ${pct(k.comp.score)}｜需求 ${k.needs.total} 件`:
        d.includes('director')?`核定事項 ${(db.director.approvals||[]).length} 項｜T 已確認 ${Object.values(db.director.T||{}).filter(x=>x.r).length}/8`:
        `靜態條文已判定 ${Object.values(db.static.clauses||{}).filter(x=>x.r).length} 條`;
      const sent={}; d.forEach(p=>sent[p]=(db[p]||{})._ts);
      const j=await Cloud.req('POST',{parts,kpi,by,summary});
      const now=Store.load(); Cloud.setDirty(Cloud.dirty().filter(p=>(now[p]||{})._ts!==sent[p]));
      Cloud.last=new Date(); Cloud.status('ok','');
      Cloud.apply(j.data);
    }catch(e){Cloud.status('err',String(e.message||e))}
    finally{Cloud.busy=false; if(Cloud.dirty().length&&Cloud.state!=='err'&&Auth.verified&&!Auth.isViewer()) Cloud.schedule()}
  },
  async pull(){
    if(!Cloud.url()||!Auth.verified||Cloud.busy) return; Cloud.busy=true; if(Cloud.state!=='pending')Cloud.status('sync');
    try{const j=await Cloud.req('GET');if(j.user){Auth.user=j.user;Auth.updateChip()}Cloud.last=new Date();Cloud.status(Cloud.dirty().length&&!Auth.isViewer()?'pending':'ok','');Cloud.apply(j.data)}
    catch(e){Cloud.status('err',String(e.message||e))}
    finally{Cloud.busy=false}
  },
  pendingApply:false,
  apply(data){
    if(!data) return; const db=Store.load(), dirty=Cloud.dirty(); let ch=false;
    ALL_PARTS.forEach(p=>{const r=data[p];if(r&&(r._ts||0)>((db[p]||{})._ts||0)&&!dirty.includes(p)){db[p]=r;ch=true}});
    if(!ch) return; Store.raw(db);
    const ae=document.activeElement, typing=ae&&ae.matches&&ae.matches('main input,main textarea,main select');
    if(typing||Store._t){Cloud.pendingApply=true;return}
    Cloud.pendingApply=false; if(window.onExternalUpdate) window.onExternalUpdate(); toast('已載入雲端最新資料');
  },
  startPoll(){
    if(Cloud.dirty().length&&!Auth.isViewer()) Cloud.push();
    clearInterval(Cloud.poll); Cloud.poll=setInterval(()=>{if(document.hidden||!Auth.verified)return; (Cloud.dirty().length&&!Auth.isViewer())?Cloud.push():Cloud.pull()},30000);
    if(!Cloud._bound){
      Cloud._bound=true;
      window.addEventListener('focus',()=>{if(Auth.verified)Cloud.pull()});
      document.addEventListener('focusout',()=>setTimeout(()=>{if(Cloud.pendingApply){const ae=document.activeElement;if(!(ae&&ae.matches&&ae.matches('main input,main textarea,main select'))){Cloud.pendingApply=false;window.onExternalUpdate&&window.onExternalUpdate();toast('已載入雲端最新資料')}}},300));
    }
  },
  start(){
    if(!Cloud.url()){Cloud.status('off');return}
    Auth.boot();
  },
};

<main>
  <div class="page-title">
    <div><h1>修改後靜態檢核表｜115年隔離醫院緊急應變計畫</h1>
      <p>指揮官及主管單位掌握整備。動態查核（現場主管 B1–B12、院長 T1–T8、即時 KPI）完成後，本表自動標出要複核的條文與已驗證的條文。</p></div>
    <div class="saved" id="savedAt">尚未儲存</div>
  </div>

  <section class="card" id="summary"></section>

  <div class="layout">
    <div id="list"></div>
    <aside class="side" id="side"></aside>
  </div>
</main>
<script>
renderTopbar('static');
let db=Store.load(); const S=()=>db.static, F=()=>db.field, D=()=>db.director;
let filter='all';
const ALL=CLAUSES.flatMap(s=>s.items.map(i=>Object.assign(i,{sec:s.sec})));
function effT(t){const v=((D().T||{})[t.id]||{}).r;return v||worst(t.B.map(b=>(F().items[b]||{}).r))}

function kpiTriggers(k){
  const m={}; const add=(ids,msg)=>ids.forEach(i=>(m[i]||(m[i]=[])).push(msg));
  if(k.level!=='green') add(['5-3-1','5-3-4'],'目前'+LEVEL[k.level].name.split('｜')[0]+'：確認啟動條件與階段定義是否符合現況');
  if(k.level==='red'||k.level==='purple') add(['5-7-4','5-7-3'],LEVEL[k.level].name+'：確認降載、停收與轉院流程');
  if(k.ppeMargin!=null&&k.ppeMargin<0) add(['5-5-2'],'PPE 可撐 '+F().ops.ppeDays+' 天 < 交期 '+F().ops.ppeLead+' 天');
  if(k.staffShort.length) add(['5-4-2','5-4-4'],'當班人力未達最低需求（'+k.staffShort.map(z=>z.name).join('、')+'）');
  if(k.o2!=null&&k.o2>=85) add(['5-5-1'],'供氧系統負載 '+k.o2+'%');
  if(k.ventOcc!=null&&k.ventOcc>=.85) add(['5-5-1'],'呼吸器佔用 '+pct(k.ventOcc));
  if(k.edWait!=null&&k.edWait>=6) add(['5-7-1'],'急診等床 '+k.edWait+' 小時');
  if(k.needs.overdue.length) add(['5-8-3','5-5-2'],'資源需求逾期未到位 '+k.needs.overdue.map(x=>x.id).join('、'));
  if(k.latestDays!=null&&k.latestDays<0) add(['5-3-5','5-7-3'],'已逾最晚院長決策時間');
  return m;
}
function linkage(k){
  const trig=kpiTriggers(k), out={};
  ALL.forEach(c=>{
    const links=[...B_ITEMS.filter(b=>b.S.includes(c.id)).map(b=>({src:b.id,name:b.t,r:(F().items[b.id]||{}).r,gap:(F().items[b.id]||{}).gap})),
                 ...T_ITEMS.filter(t=>t.S.includes(c.id)).map(t=>({src:t.id,name:t.t,r:effT(t),gap:((D().T||{})[t.id]||{}).note}))];
    const rs=links.map(l=>l.r), kp=trig[c.id]||[];
    let st='none';
    if(rs.some(r=>r==='part'||r==='none')||kp.length) st='review';
    else if(links.length&&rs.filter(r=>r&&r!=='na').length&&rs.every(r=>!r||r==='full'||r==='na')&&rs.some(r=>r==='full')) st='verified';
    else if(links.length) st='pending';
    out[c.id]={links,kp,st,sug:worst(rs)};
  });
  return out;
}
const ST={review:['r','需複核'],verified:['g','動態已驗證'],pending:['n','待動態填報'],none:['n','無動態對應']};
const C=id=>S().clauses[id]||(S().clauses[id]={checks:{},contacts:{}});

function render(){
  const k=computeKPI(F()), lk=linkage(k);
  const filled=ALL.filter(c=>(S().clauses[c.id]||{}).r).length;
  const comp=compliance(Object.fromEntries(ALL.map(c=>[c.id,{r:(S().clauses[c.id]||{}).r}])),ALL);
  const cnt=s=>ALL.filter(c=>lk[c.id].st===s).length;
  const L=LEVEL[k.level];
  $('#summary').innerHTML=`<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
    ${ring(comp.score)}
    <div style="min-width:180px"><div style="font-weight:700;color:var(--g900)">靜態條文符合度</div><div class="mini">已判定 ${filled}/${ALL.length} 條</div>
      <div class="legend" style="margin-top:4px"><span><i style="background:var(--g600)"></i>全 ${comp.full}</span><span><i style="background:#f59e0b"></i>部 ${comp.part}</span><span><i style="background:var(--red)"></i>無 ${comp.none}</span><span><i style="background:#94a3b8"></i>不適用 ${comp.na}</span></div></div>
    <div class="kpis" style="flex:1 1 380px">
      <div class="kpi ${cnt('review')?'bad':''}"><div class="k">動態結果 → 需複核</div><div class="v">${cnt('review')}<small>條</small></div></div>
      <div class="kpi good"><div class="k">動態已驗證</div><div class="v">${cnt('verified')}<small>條</small></div></div>
      <div class="kpi"><div class="k">待動態填報</div><div class="v">${cnt('pending')}<small>條</small></div></div>
      <div class="kpi"><div class="k">目前警示（現場）</div><div class="v" style="font-size:17px;color:inherit"><span class="chip ${({green:'g',yellow:'y',red:'r',purple:'p'})[k.level]}" style="font-size:13px">${L.name}</span></div><div class="s">${SURGE[k.surge].name}</div></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px" class="noprint"><button class="btn pri" id="prefill">依動態結果預填建議</button><span class="mini">只填入尚未判定的條文</span></div></div>`;
  $('#prefill').onclick=()=>{let n=0;ALL.forEach(c=>{const s=lk[c.id].sug;if(s&&!C(c.id).r){C(c.id).r=s;C(c.id).auto=true;n++}});Store.write(db);render();toast(`已預填 ${n} 條，請逐條確認`)};

  const show=c=>{const st=lk[c.id].st,r=(S().clauses[c.id]||{}).r;return filter==='all'||(filter==='unset'?!r:st===filter)};
  $('#list').innerHTML=CLAUSES.map(sec=>{const its=sec.items.filter(show);if(!its.length)return '';
    return `<section class="card" id="sec-${esc(sec.sec)}"><div class="sec-h"><h2>${sec.sec}</h2></div>${its.map(c=>card(c,lk[c.id])).join('')}</section>`}).join('')||'<div class="empty">此篩選條件下沒有條文。</div>';
  bindCards();
  // side
  $('#side').innerHTML=`<div class="card noprint"><div class="mini" style="font-weight:600;color:var(--g800);margin-bottom:6px">篩選</div>
     <div class="seg" id="flt" style="flex-wrap:wrap">${[['all','全部'],['review','需複核'],['verified','已驗證'],['unset','未判定']].map(([v,l])=>`<button type="button" class="${filter===v?'on':''}" data-f="${v}">${l}</button>`).join('')}</div></div>
    <div class="card"><div class="mini" style="font-weight:600;color:var(--g800);margin-bottom:6px">章節進度</div>
     ${CLAUSES.map(s=>{const d=s.items.filter(c=>(S().clauses[c.id]||{}).r).length, rv=s.items.filter(c=>lk[c.id].st==='review').length;
       return `<a href="#sec-${esc(s.sec)}" style="display:block;text-decoration:none;color:inherit;margin:6px 0"><div style="display:flex;justify-content:space-between;font-size:12.5px"><span>${s.sec}</span><span class="mini">${rv?`<span style="color:var(--red)">●${rv}</span> `:''}${d}/${s.items.length}</span></div><div class="bar"><i style="width:${d/s.items.length*100}%"></i></div></a>`}).join('')}</div>
    <div class="card soft"><div class="mini"><b>連動規則</b><br>・對應的 B／T 項為「部／無」→ 需複核<br>・對應的 B／T 項全為「全」→ 動態已驗證<br>・即時 KPI 觸發（警示燈號、PPE 餘裕、人力、供氧、逾期需求）→ 需複核<br>・院長 T 項未確認時，採現場建議值</div></div>`;
  $$('#flt button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
}
function card(c,l){
  const v=C(c.id), done=(c.c||[]).filter((_,i)=>v.checks[i]).length;
  const [cc,cl]=ST[l.st];
  return `<div class="item st-${v.r||''}" id="c-${c.id}" style="${l.st==='review'?'background:#fffafa':''}">
   <div class="hd"><span class="code">${c.id}</span><div style="flex:1;min-width:260px"><div class="ttl">${c.t} ${c.isNew?'<span class="chip p">新增</span>':''} <span class="chip ${cc}">${cl}</span></div>
     ${c.d?`<div class="q">${c.d}</div>`:''}
     ${l.links.length||l.kp.length?`<div style="margin-top:6px;display:flex;flex-direction:column;gap:3px">${l.links.map(x=>`<div class="mini">${resChip(x.r)} <b>${x.src}</b> ${x.name}${x.gap&&x.r!=='full'?'：'+esc(x.gap):''}</div>`).join('')}${l.kp.map(m=>`<div class="mini" style="color:var(--red)">⚑ KPI：${esc(m)}</div>`).join('')}</div>`:''}</div>
   <div class="right">${seg(c.id,v.r)}${v.auto&&v.r?'<span class="chip y">預填，待確認</span>':''}${l.sug&&l.sug!==v.r?`<button class="btn sm" data-apply="${c.id}" data-s="${l.sug}">套用動態建議：${RES[l.sug]}</button>`:''}${c.c?`<span class="mini">細項 ${done}/${c.c.length}</span>`:''}</div></div>
   ${c.c?`<div class="checks">${c.c.map((t,i)=>`<label><input type="checkbox" data-ck="${c.id}" data-i="${i}" ${v.checks[i]?'checked':''}><span>${t}</span></label>`).join('')}</div>`:''}
   ${c.k?`<div class="grid g3" style="margin-top:10px">${c.k.map((kk,i)=>{const p=v.contacts[i]||{};return kk==='預定演練日期'?`<label class="f">${kk}<input type="date" data-ct="${c.id}" data-i="${i}" data-k="name" value="${esc(p.name)}"></label>`:`<div><div class="mini" style="margin-bottom:3px">${kk}</div><div style="display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:4px">${['name','title','tel'].map((f,j)=>`<input type="text" placeholder="${['姓名','職稱','聯絡方式'][j]}" data-ct="${c.id}" data-i="${i}" data-k="${f}" value="${esc(p[f])}">`).join('')}</div></div>`}).join('')}</div>`:''}
   <label class="f" style="margin-top:10px">佐證／說明${v.r==='na'?'（不適用須說明理由）':''}<textarea rows="1" data-nt="${c.id}">${esc(v.note)}</textarea></label></div>`;
}
function bindCards(){
  $$('[data-ck]').forEach(el=>el.onchange=()=>{C(el.dataset.ck).checks[el.dataset.i]=el.checked;Store.saveSoon(db);const c=ALL.find(x=>x.id===el.dataset.ck);const sp=$(`#c-${CSS.escape(c.id)} .right .mini:last-child`);if(sp)sp.textContent=`細項 ${c.c.filter((_,i)=>C(c.id).checks[i]).length}/${c.c.length}`});
  $$('[data-ct]').forEach(el=>el.oninput=()=>{const o=C(el.dataset.ct).contacts;(o[el.dataset.i]||(o[el.dataset.i]={}))[el.dataset.k]=el.value;Store.saveSoon(db)});
  $$('[data-nt]').forEach(el=>el.oninput=()=>{C(el.dataset.nt).note=el.value;Store.saveSoon(db)});
  $$('[data-apply]').forEach(b=>b.onclick=()=>{C(b.dataset.apply).r=b.dataset.s;C(b.dataset.apply).auto=false;Store.write(db);render()});
}
bindSeg($('#list'),(id,v)=>{C(id).r=v;C(id).auto=false;Store.write(db);render()});
window.onExternalUpdate=()=>{db=Store.load();render()};
render(); Store._stamp(db);
</script>

</body></html>
